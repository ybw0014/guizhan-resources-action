name: PR

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Package
        run: bun run package

      - name: Verify dist is up to date
        run: |
          git show HEAD:dist/index.js > /tmp/committed-dist.js
          cat > /tmp/fingerprint.js <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          function fingerprint(file) {
            const content = fs.readFileSync(file, "utf8").replace(/\r/g, "");
            const parts = content.split("/***/").map((p) => crypto.createHash("sha256").update(p).digest("hex"));
            parts.sort();
            return crypto.createHash("sha256").update(parts.join("\n")).digest("hex");
          }
          const committed = fingerprint("/tmp/committed-dist.js");
          const current = fingerprint("dist/index.js");
          if (committed !== current) {
            console.error("dist/index.js out of date: committed " + committed + " vs current " + current);
            process.exit(1);
          }
          console.log("dist fingerprint OK: " + current);
          EOF
          bun /tmp/fingerprint.js

      - name: Actionlint
        run: bun run actionlint
