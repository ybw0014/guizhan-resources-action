name: PR

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.5.1"
          cache: bun
          cache-dependency-path: "**/bun.lock"

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Package
        run: bun run package

      - name: Actionlint
        run: bun run actionlint
