name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Package
        run: bun run package

      - name: Verify dist is up to date
        run: |
          git show HEAD:dist/index.cjs > /tmp/committed-dist.js
          cat > /tmp/fingerprint.js <<'EOF'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          function fingerprint(file) {
            const content = fs.readFileSync(file, "utf8").replace(/\r/g, "");
            const parts = content.split("/***/").map((p) => crypto.createHash("sha256").update(p).digest("hex"));
            parts.sort();
            return crypto.createHash("sha256").update(parts.join("\n")).digest("hex");
          }
          const committed = fingerprint("/tmp/committed-dist.js");
          const current = fingerprint("dist/index.cjs");
          if (committed !== current) {
            console.error("dist/index.cjs out of date: committed " + committed + " vs current " + current);
            process.exit(1);
          }
          console.log("dist fingerprint OK: " + current);
          EOF
          bun /tmp/fingerprint.js

      - name: Actionlint
        run: bun run actionlint

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Update major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR_TAG="v${GITHUB_REF_NAME#v}"
          MAJOR_TAG="${MAJOR_TAG%%.*}"
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force
